name: Negativer Strompreis E-Mail-Alert

on:
  schedule:
    # 11:00 und 17:00 UTC = 13:00 und 19:00 Uhr MESZ (Sommerzeit).
    # GitHub-Cron rechnet immer in UTC, daher verschiebt es sich im Winter (MEZ)
    # auf 12:00 und 18:00 Uhr lokale Zeit.
    - cron: "0 11,17 * * *"
  workflow_dispatch: {}

jobs:
  check-negative-price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check tomorrow's day-ahead price
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          BIDDING_ZONE: ${{ vars.BIDDING_ZONE }}
        run: python negative_price_alert.py
