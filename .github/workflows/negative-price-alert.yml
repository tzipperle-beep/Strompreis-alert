name: Negativer Strompreis E-Mail-Alert

on:
  schedule:
    # 13:00 UTC = 14:00/15:00 MEZ/MESZ, nach Veroeffentlichung der Day-Ahead-Preise
    - cron: "0 13 * * *"
  workflow_dispatch: {}

jobs:
  check-negative-price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check tomorrow's day-ahead price
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          BIDDING_ZONE: ${{ vars.BIDDING_ZONE }}
        run: python negative_price_alert.py
