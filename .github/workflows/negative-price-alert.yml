name: Negativer Strompreis WhatsApp-Alert

on:
  schedule:
    # 13:00 UTC = 14:00/15:00 MEZ/MESZ, nach Veroeffentlichung der Day-Ahead-Preise
    - cron: "0 13 * * *"
  workflow_dispatch: {}

jobs:
  check-negative-price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check tomorrow's day-ahead price
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          BIDDING_ZONE: ${{ vars.BIDDING_ZONE }}
        run: python negative_price_alert.py
